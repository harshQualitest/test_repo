# Nginx Configuration with CSP Nonce Support
# Replace NONCE_VALUE_HERE with the nonce from deploy script

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/qualicollect;
    index index.html;

    # ============================================
    # STRICT CSP with Nonce (No unsafe-inline!)
    # ============================================
    # Replace NONCE_VALUE_HERE with your nonce after each deployment
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-NONCE_VALUE_HERE' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:8080 http://10.250.2.55/api; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    
    # Additional Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # ============================================
    # COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================
    # CACHING STRATEGY
    # ============================================
    
    # Cache static assets with content hash (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    
    # Don't cache HTML (SPA routing)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Re-add CSP for HTML responses
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-NONCE_VALUE_HERE' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:8080 http://10.250.2.55/api; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ============================================
    # SPA ROUTING
    # ============================================
    location / {
        try_files $uri /index.html;
    }

    # ============================================
    # API PROXY
    # ============================================
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ============================================
    # HEALTH CHECK
    # ============================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # ============================================
    # SECURITY: DENY HIDDEN FILES
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
